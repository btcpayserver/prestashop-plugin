name: "Release"

on:
  push:
    tags: [ 'v*' ] # Push events to matching v*, i.e. v1.0, v20.15.10

permissions: {}

jobs:
  linting:
    name: "Release a new ZIP"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@c2d88d3ecc89a9ef08eebf45d9637801dcee7eb5" # v6.0.0
        with:
          persist-credentials: false
      - name: "Setup PHP, with composer and extensions"
        uses: "shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1" # v2.36.0
        with:
          php-version: "8.0"
          extensions: "mbstring, xml, ctype, iconv, intl, gd"
          tools: "composer:v2"
      - name: "Get composer cache directory"
        id: "composer-cache"
        run: 'echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT'
      - name: "Cache composer dependencies"
        uses: "actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7" # v5.0.2
        with:
          path: "${{ steps.composer-cache.outputs.dir }}"
          key: "${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}"
          restore-keys: "${{ runner.os }}-composer-"
          lookup-only: true
      - name: "Validate composer"
        run: "composer validate"
      - name: "Install Composer dependencies"
        run: "composer install --prefer-dist --no-progress --no-suggest --optimize-autoloader"

      # Zip the module
      - name: "Make zip"
        run: "make"

      # Make a release from the tag and upload the zip
      - name: "Create Release"
        id: "create_release"
        uses: "softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b" # v2.5.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        with:
          name: "Release ${{ github.ref_name }}"
          files: "./build/btcpay.zip"
          fail_on_unmatched_files: true
          generate_release_notes: true
