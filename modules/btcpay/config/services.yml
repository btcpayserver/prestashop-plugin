services:
  _defaults:
    public: true

  # Module
  prestashop.module.btcpay:
    class: BTCPay
    public: true

  BTCPay:
    alias: prestashop.module.btcpay
    public: true

  # Repositories
  BTCPay\Repository\TableRepository:
    arguments:
      - '@doctrine.dbal.default_connection'

  BTCPay\Repository\BitcoinPaymentRepository:
    arguments:
      - '@doctrine.orm.entity_manager'

  BTCPay\Repository\WebhookDeliveryRepository:
    arguments:
      - '@doctrine.dbal.default_connection'

  BTCPay\Repository\OrderPaymentRepository:
    arguments:
      - '@doctrine.dbal.default_connection'

  BTCPay\Repository\OrderInvoicePaymentLinker:
    arguments:
      - '@doctrine.dbal.default_connection'

  BTCPay\Server\AuthorizationToken:
    arguments:
      - '@PrestaShop\PrestaShop\Core\Domain\Configuration\ShopConfigurationInterface'
      - '@doctrine.dbal.default_connection'

  BTCPay\Github\Versioning:
    arguments: []

  BTCPay\Server\Factory:
    arguments:
      - '@prestashop.module.btcpay'
      - '@PrestaShop\PrestaShop\Core\Domain\Configuration\ShopConfigurationInterface'
      - '@BTCPay\Repository\BitcoinPaymentRepository'

  BTCPay\Invoice\PaymentReturn:
    arguments:
      - '@prestashop.module.btcpay'
      - '@PrestaShop\PrestaShop\Core\Domain\Configuration\ShopConfigurationInterface'
      - '@BTCPay\Repository\BitcoinPaymentRepository'
      - '@doctrine.dbal.default_connection'
      - '@BTCPay\Repository\OrderPaymentRepository'
      - '@BTCPay\Repository\OrderInvoicePaymentLinker'

  BTCPay\Server\WebhookReceiver:
    arguments:
      - '@prestashop.module.btcpay'
      - '@PrestaShop\PrestaShop\Core\Domain\Configuration\ShopConfigurationInterface'
      - '@BTCPay\Repository\BitcoinPaymentRepository'
      - '@BTCPay\Repository\WebhookDeliveryRepository'
      - '@doctrine.dbal.default_connection'
      - '@BTCPay\Repository\OrderPaymentRepository'
      - '@BTCPay\Repository\OrderInvoicePaymentLinker'

  # Controllers
  BTCPay\Controller\Admin\Improve\Payment\ConfigureController:
    autowire: true
    autoconfigure: true
    public: true
    tags: ['controller.service_arguments']

  # Form data provider
  prestashop.module.btcpay.form.server.provider:
    class: BTCPay\Form\ServerFormDataProvider
    arguments:
      - '@PrestaShop\PrestaShop\Core\Domain\Configuration\ShopConfigurationInterface'
  prestashop.module.btcpay.form.general.provider:
    class: BTCPay\Form\GeneralFormDataProvider
    arguments:
      - '@PrestaShop\PrestaShop\Core\Domain\Configuration\ShopConfigurationInterface'

  # Form type
  prestashop.module.btcpay.form.type.server:
    class: BTCPay\Form\Type\ServerType
    parent: 'form.type.translatable.aware'
    public: true
    calls:
      - [setShopConfiguration, ['@PrestaShop\PrestaShop\Core\Domain\Configuration\ShopConfigurationInterface']]
    tags: [{ name: form.type }]

  prestashop.module.btcpay.form.type.general:
    class: BTCPay\Form\Type\GeneralType
    parent: 'form.type.translatable.aware'
    public: true
    tags: [{ name: form.type }]

  # Form handler
  prestashop.module.btcpay.form_handler.server:
    class: PrestaShop\PrestaShop\Core\Form\Handler
    arguments:
      $formFactory: '@Symfony\Component\Form\FormFactoryInterface'
      $hookDispatcher: '@prestashop.core.hook.dispatcher'
      $formDataProvider: '@prestashop.module.btcpay.form.server.provider'
      $form: 'BTCPay\Form\Type\ServerType'
      $hookName: 'ServerType'
      $formName: 'server-form'

  prestashop.module.btcpay.form_handler.general:
    class: PrestaShop\PrestaShop\Core\Form\Handler
    arguments:
      $formFactory: '@Symfony\Component\Form\FormFactoryInterface'
      $hookDispatcher: '@prestashop.core.hook.dispatcher'
      $formDataProvider: '@prestashop.module.btcpay.form.general.provider'
      $form: 'BTCPay\Form\Type\GeneralType'
      $hookName: 'GeneralType'
      $formName: 'general-form'
