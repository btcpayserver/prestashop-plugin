admin_btcpay_configure:
  path: /btcpay/configure
  methods: [GET]
  defaults:
    _controller: 'BTCPay\Controller\Admin\Improve\Payment\ConfigureController::viewAction'
    _legacy_controller: AdminConfigureBTCPay
    _legacy_link: AdminConfigureBTCPay
    _disable_module_prefix: true

admin_btcpay_configure_server_process:
  path: /btcpay/configure
  methods: [GET, POST]
  defaults:
    _controller: 'BTCPay\Controller\Admin\Improve\Payment\ConfigureController::editServerSettingsAction'
    _legacy_controller: AdminConfigureBTCPay
    _disable_module_prefix: true

admin_btcpay_configure_general_process:
  path: /btcpay/configure/general
  methods: [GET, POST]
  defaults:
    _controller: 'BTCPay\Controller\Admin\Improve\Payment\ConfigureController::editGeneralSettingsAction'
    _legacy_controller: AdminConfigureBTCPay
    _disable_module_prefix: true

admin_btcpay_validate:
  path: /btcpay/api-key/validate
  methods: [GET, POST]
  defaults:
    _controller: 'BTCPay\Controller\Admin\Improve\Payment\ConfigureController::validateAPIKeyAction'
    _legacy_controller: AdminConfigureBTCPay
    _disable_module_prefix: true
    # BTCPay redirects the browser back with a cross-site POST. Browsers do not send
    # SameSite=Lax session cookies on such requests, so the CSRF token stored in the
    # session cannot be validated. A single-use, expiring btcpay_state query token
    # authorizes configuration changes before the posted API key is validated.
    _anonymous_controller: true

# No session is written on the cross-site POST. This GET restores the browser's
# admin session before adding flash messages and generating the settings URL.
admin_btcpay_authorization_complete:
  path: /btcpay/api-key/complete
  methods: [GET]
  defaults:
    _controller: 'BTCPay\Controller\Admin\Improve\Payment\ConfigureController::completeAuthorizationAction'
    _legacy_controller: AdminConfigureBTCPay
    _disable_module_prefix: true
    _anonymous_controller: true
